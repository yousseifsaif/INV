<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دعوة خطوبه </title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<link href='https://fonts.googleapis.com/css?family=Pinyon Script' rel='stylesheet'>

<style>
:root{--bg:#f6efe3;--ink:#3a2e26;--accent:#a8742f;--card:#fffaf0;--line:#d9c7a6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1814;--ink:#efe4d0;--accent:#d4a55a;--card:#2a231d;--line:#4a3d30}}
:root[data-theme="dark"]{--bg:#1d1814;--ink:#efe4d0;--accent:#d4a55a;--card:#2a231d;--line:#4a3d30}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Amiri','Traditional Arabic',serif;text-align:center}
section{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;gap:18px}
.t{font-family:'Aref Ruqaa','Amiri',serif;min-height:1.4em}
.small{font-size:1.2rem;color:var(--accent);letter-spacing:1px}
.names{font-size:clamp(2.6rem,12vw,5rem);font-weight:700;line-height:1.3}
.amp{display:block;font-size:2rem;color:var(--accent)}
.msg{font-size:clamp(1.3rem,5vw,1.8rem);line-height:2;max-width:520px}
.caret::after{content:"";display:inline-block;width:2px;height:1em;background:var(--accent);margin-inline-start:3px;vertical-align:-0.12em;animation:b .8s steps(1) infinite}
@keyframes b{50%{opacity:0}}
.frame{width:min(78vw,300px);aspect-ratio:3/4;border:2px solid var(--line);padding:10px;background:var(--card);border-radius:150px 150px 12px 12px;opacity:0;transform:translateY(20px);transition:all 1.2s ease}
.frame>div{width:100%;height:100%;border-radius:140px 140px 6px 6px;background:linear-gradient(160deg,var(--line),var(--card));display:flex;align-items:center;justify-content:center;font-size:4rem;color:var(--accent);overflow:hidden}
.frame img{width:100%;height:100%;object-fit:cover}
.show{opacity:1;transform:none}
.date{font-size:clamp(1.6rem,7vw,2.4rem);font-weight:700}
.cd{display:flex;gap:12px;opacity:0;transition:opacity 1.2s}
.cd div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:68px}
.cd b{display:block;font-size:1.8rem;color:var(--accent)}
.btn{display:inline-block;margin-top:8px;padding:12px 28px;border:2px solid var(--accent);color:var(--accent);border-radius:40px;text-decoration:none;font-size:1.3rem;opacity:0;transition:all .3s}
.btn:hover{background:var(--accent);color:var(--bg)}
.hint{position:absolute;bottom:20px;font-size:1rem;color:var(--accent);animation:b 1.6s infinite}
.hero{position:relative}
/* ===== Elegant Footer ===== */

.site-footer {
  position: relative;
  padding: 30px 20px 24px;
  background: var(--bg);
  color: var(--ink);
  text-align: center;
  overflow: hidden;
}

.footer-divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  max-width: 220px;
  margin: 0 auto 22px;
  color: var(--accent);
}

.footer-divider::before,
.footer-divider::after {
  content: "";
  height: 1px;
  flex: 1;
  background: linear-gradient(
    to left,
    transparent,
    var(--line)
  );
}

.footer-divider::after {
  background: linear-gradient(
    to right,
    transparent,
    var(--line)
  );
}

.footer-divider span {
  font-size: 17px;
  line-height: 1;
}

.footer-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
}

.footer-credit {
  margin: 0;
  font-size: 14px;
  opacity: 0.75;
  letter-spacing: 0.4px;
}

.footer-brand {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  direction: ltr;
}

.footer-heart {
  color: var(--accent);
  font-size: 15px;
  animation: footerHeartbeat 2s ease-in-out infinite;
}

.footer-name {
  position: relative;
  color: var(--accent);
  text-decoration: none;
  font-family: "Pinyon Script", cursive;
  font-size: 31px;
  font-weight: 400;
  transition: color 0.3s ease;
}

.footer-name::after {
  content: "";
  position: absolute;
  bottom: -2px;
  left: 0;
  width: 0;
  height: 1px;
  background: var(--accent);
  transition: width 0.3s ease;
}

.footer-name:hover::after {
  width: 100%;
}

.footer-name:hover {
  color: var(--ink);
}

.footer-caption {
  margin: 3px 0 12px;
  font-size: 12px;
  letter-spacing: 0.5px;
  opacity: 0.65;
}

.footer-bottom {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  width: min(100%, 240px);
  font-size: 11px;
  opacity: 0.65;
}

.footer-dot {
  color: var(--accent);
  font-size: 12px;
}

@keyframes footerHeartbeat {
  0%, 100% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.15);
  }
}

@media (max-width: 480px) {
  .site-footer {
    padding: 25px 16px 20px;
  }

  .footer-name {
    font-size: 29px;
  }

  .footer-caption {
    font-size: 11px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .footer-heart {
    animation: none;
  }

  .footer-name,
  .footer-name::after {
    transition: none;
  }
}


body.lock{overflow:hidden}
#gate{position:fixed;inset:0;z-index:9;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .8s}
#gate.out{opacity:0;pointer-events:none}
#gate .env{font-size:5rem}
#open{font-family:inherit;font-size:1.5rem;padding:12px 34px;border:2px solid var(--accent);background:transparent;color:var(--accent);border-radius:40px;cursor:pointer}
#open:hover{background:var(--accent);color:var(--bg)}
</style>
</head>
<body class="lock">
<div id="gate"><div class="env">💌</div><div class="t msg">عندك دعوة فرح</div><button id="open">افتح الدعوة</button></div>

<section class="hero" data-seq>
  <div class="t small" data-type="بسم الله الرحمن الرحيم" style="font-size: 60px; font-weight: bold;"></div>
  <div class="t small" data-type="يتشرفوا بدعوتكم لحضور فرح"style="font-size: 20px;"></div>
  <div class="t names" data-type="Omar" data-delay="300" style="font-family: 'Pinyon Script', cursive; font-size: 50px;"></div>
  <span class="amp t" data-type="&" style="font-size: 34px;font-weight: bold;"></span>
  <div class="t names" data-type="Mariam" data-delay="300" style="font-family: 'Pinyon Script'; font-size: 50px;"></div>
</section>
<section data-seq>
<div class="frame">
  <div>
    <img src="" alt="صورة ">
  </div>
</div>
  <div class="t msg" data-type="بقلوب مليانة فرحة، بنعلن بداية حكايتنا، ونتمنى وجودكم يكمّل فرحتنا ويدّيها طعم تاني."></div>
</section>
<section data-seq>
  <div class="t small" data-type="ميعاد الفرح" style="font-size: 34px;" ></div>
  <div class="t date" data-type="الاربعاء 4 نوفمبر 2026"></div>
  <div class="t msg" data-type="الساعة 7:00 مساءً"></div>
  <div class="cd" id="cd">
    <div><b id="d">0</b>يوم</div><div><b id="h">0</b>ساعة</div><div><b id="m">0</b>دقيقة</div><div><b id="sc">0</b>ثانية</div>
  </div>
</section>

<section data-seq>
  <div class="t small" data-type="مكان الفرح" style="font-size: 34px;"></div>
  <div class="t date" data-type="قاعة الماسة"></div>
  <div class="t msg" data-type="كورنيش المعادي"></div>
  <a class="btn" id="map" target="_blank" rel="noopener" href="https://www.google.com/maps/place/%D9%83%D9%88%D8%B1%D9%86%D9%8A%D8%B4+%D8%A7%D9%84%D9%85%D8%B9%D8%A7%D8%AF%D9%8A%E2%80%AD/@29.9774667,31.2360151,17z/data=!3m1!4b1!4m9!3m8!1s0x14584700162b4e77:0x94af99116aed59bc!5m2!4m1!1i2!8m2!3d29.9774621!4d31.2334402!16s%2Fg%2F11wc2klp59?authuser=0&entry=ttu&g_ep=EgoyMDI2MDkzMC4wIKXMDSoASAFQAw%3D%3D">افتح الموقع على الخريطة</a>
  <div class="t msg" data-type="وجودكم يشرفنا ♥" data-delay="400"></div>
</section>

<script>
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let ac,buf,master;
function initAudio(){
  ac=new (window.AudioContext||window.webkitAudioContext)();
  master=ac.createGain();master.gain.value=0.7;
  const comp=ac.createDynamicsCompressor();master.connect(comp);comp.connect(ac.destination);
  const n=Math.floor(ac.sampleRate*0.06);
  buf=ac.createBuffer(1,n,ac.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(n*0.12));
}
function click(space){
  if(!ac)return;const t=ac.currentTime;
  const src=ac.createBufferSource();src.buffer=buf;src.playbackRate.value=0.9+Math.random()*0.3;
  const hp=ac.createBiquadFilter();hp.type='highpass';hp.frequency.value=space?1200:2500;
  const g=ac.createGain();g.gain.value=space?0.5:0.8;
  src.connect(hp);hp.connect(g);g.connect(master);src.start(t);
  const o=ac.createOscillator();o.type='sine';
  const f0=(space?90:140)+Math.random()*30;
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f0*0.5,t+0.06);
  const og=ac.createGain();og.gain.setValueAtTime(space?0.9:0.6,t);og.gain.exponentialRampToValueAtTime(0.001,t+0.07);
  o.connect(og);og.connect(master);o.start(t);o.stop(t+0.08);
}
function ding(){
  if(!ac)return;const t=ac.currentTime;
  [2093,3136,4186].forEach((fr,i)=>{
    const o=ac.createOscillator();o.type='sine';o.frequency.value=fr;
    const g=ac.createGain();g.gain.setValueAtTime(0.18/(i+1),t);g.gain.exponentialRampToValueAtTime(0.0001,t+1.4);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+1.5);
  });
}
async function typeEl(el){
  const txt=el.dataset.type;
  el.classList.add('caret');
  await sleep(+el.dataset.delay||0);
  for(let i=1;i<=txt.length;i++){el.textContent=txt.slice(0,i);click(txt[i-1]===' ');await sleep(txt[i-1]===' '?90:65)}
  if(txt.length>14)ding();await sleep(250);
  el.classList.remove('caret');
}
async function play(sec){
  sec.dataset.started=1;
  const f=sec.querySelector('.frame');
  if(f){f.classList.add('show');await sleep(900)}
  for(const el of sec.querySelectorAll('[data-type]')) await typeEl(el);
  const cd=sec.querySelector('.cd'); if(cd) cd.style.opacity=1;
  const b=sec.querySelector('.btn'); if(b) b.style.opacity=1;
  // أوتو سكرول للسيكشن اللي بعده بعد ما الكتابة تخلص
  const next=sec.nextElementSibling;
  if(next&&next.matches('[data-seq]')&&!next.dataset.started){
    await sleep(2000);
    if(!next.dataset.started) next.scrollIntoView({behavior:'smooth',block:'start'});
  }
}
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting&&!e.target.dataset.started){io.unobserve(e.target);play(e.target)}
}),{threshold:.5});
document.getElementById('open').onclick=()=>{
  try{initAudio();if(ac.state==='suspended')ac.resume()}catch(e){}
  document.body.classList.remove('lock');
  document.getElementById('gate').classList.add('out');
  setTimeout(()=>document.querySelectorAll('[data-seq]').forEach(s=>io.observe(s)),500);
};
// reveal button early in case of reduced layouts
document.querySelectorAll('.btn').forEach(b=>b.style.opacity=0);

// موعد الفرح: الأربعاء 4 نوفمبر 2026 - الساعة 7:00 مساءً بتوقيت القاهرة
// في هذا التاريخ القاهرة تكون UTC+2
const target = new Date('2026-11-04T17:00:00Z');

const daysEl = document.getElementById('d');
const hoursEl = document.getElementById('h');
const minutesEl = document.getElementById('m');
const secondsEl = document.getElementById('sc');

function tick() {
  const now = new Date();
  let ms = target.getTime() - now.getTime();

  // لو الموعد عدى
  if (ms <= 0) {
    ms = 0;
  }

  const days = Math.floor(ms / (1000 * 60 * 60 * 24));
  const hours = Math.floor((ms / (1000 * 60 * 60)) % 24);
  const minutes = Math.floor((ms / (1000 * 60)) % 60);
  const seconds = Math.floor((ms / 1000) % 60);

  daysEl.textContent = days;
  hoursEl.textContent = hours;
  minutesEl.textContent = minutes;
  secondsEl.textContent = seconds;
}

// تشغيل العداد فورًا
tick();

// تحديث كل ثانية
setInterval(tick, 1000);

</script>

      <span class="footer-heart">♥</span>

        target="_blank"
        rel="noopener noreferrer"

      >

      </a>

</div>
</footer>
</body>
